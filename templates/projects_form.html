{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="os-background" style="background-image: url('{% static 'img/rumput.jpeg' %}');">
    <div class="retro-window" style="max-width: 700px;">
        
        <div class="title-bar">
            <div class="title-bar-text">📝 add_project.exe</div>
            <div class="title-bar-controls">
                <div class="control-btn close-btn"></div>
                <div class="control-btn min-btn"></div>
                <div class="control-btn max-btn"></div>
            </div>
        </div>
        
        <div class="window-body">
            <div style="margin-bottom: 20px;">
                <a href="{% url 'main:show_projects' %}" class="retro-btn btn-small bg-blue">⬅ Back to Projects</a>
            </div>

            <div class="retro-form-container">
                <h2 class="retro-title" style="font-size: 2.5rem; text-align: center; margin-bottom: 20px;">ADD NEW PROJECT</h2>
                
                <p style="text-align: center; font-weight: bold; margin-bottom: 20px;">
                    Tambahkan mahakarya digital lu ke dalam database!
                </p>

                <form method="POST" action="">
                    {% csrf_token %}
                    
                    {{ form.as_p }}
                    
                    <div style="display: flex; gap: 15px; margin-top: 30px;">
                        <button type="submit" class="retro-btn bg-pink" style="flex: 1; font-size: 1.2rem;">💾 SAVE PROJECT</button>
                        <a href="{% url 'main:show_projects' %}" class="retro-btn bg-yellow" style="text-align: center; padding: 12px 20px; font-size: 1.2rem;">❌ CANCEL</a>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock content %}
