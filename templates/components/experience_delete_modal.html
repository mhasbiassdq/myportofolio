<div class="project-actions">
    <a href="{% url 'main:edit_experience' experience.id %}" class="button button-secondary">Edit</a>
    
    <button type="button" 
            class="button button-danger" 
            popovertarget="delete-exp-{{ experience.id }}" 
            aria-label="Hapus {{ experience.title }}" 
            title="Hapus pengalaman">
        Hapus
    </button>
</div>

<div id="delete-exp-{{ experience.id }}" 
     class="project-delete-modal" 
     popover="auto" 
     role="dialog" 
     aria-modal="true">
    
    <button type="button" class="project-delete-modal_backdrop" popovertarget="delete-exp-{{ experience.id }}" popovertargetaction="hide"></button>
            
    <div class="project-delete-modal_content">
        <button type="button" class="project-delete-modal_close" popovertarget="delete-exp-{{ experience.id }}" popovertargetaction="hide">×</button>
        
        <h2>Hapus Data?</h2>
        <p>Apakah Anda yakin ingin menghapus <strong>{{ experience.title }}</strong> dari riwayat pengalamanmu?</p>
        
        <div class="project-delete-modal_actions">
            <button type="button" class="button button-secondary" popovertarget="delete-exp-{{ experience.id }}" popovertargetaction="hide">Batal</button>
            
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, Hapus</button>
            </form>
        </div>
    </div>
</div>
